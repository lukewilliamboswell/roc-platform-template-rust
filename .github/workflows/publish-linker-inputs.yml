name: Publish linker inputs
on:
  workflow_dispatch:
    inputs:
      pull-request:
        description: Same-repository pull request containing the material input change
        required: true
        type: string
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      attestations: read
      contents: write
      pull-requests: read
    steps:
      - uses: lukewilliamboswell/roc-automation/actions/publish-build-inputs@a25b5129340b9b2ad1744d20330b8ee4d38a1849 # a25b512
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          pull-request: ${{ inputs.pull-request }}
          producer-workflow: runtime-release.yml
          candidate-artifact: link-input-release
          lock-path: runtime/link-inputs.lock.json
          release-prefix: linker-inputs
