name: Linker input candidate
on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Attest the exact candidate for trusted publication
        required: true
        type: boolean
      expected_sha:
        description: Exact PR head selected by the trusted publisher
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: linker-input-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build linker inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Bind candidate to the publisher-selected commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - name: Test archive admission boundaries
        run: python3 -m unittest discover -s ci -p 'test_runtime*.py' -v
      - name: Build and package target-scoped archives
        run: |
          python3 ci/runtime.py build
          python3 ci/runtime.py prepare-release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linker-input-build
          path: dist/runtime/
          if-no-files-found: error
          retention-days: 30
  test:
    name: Native linker test (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x64musl
          - os: ubuntu-24.04-arm
            target: arm64musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linker-input-build
          path: dist/runtime
      - name: Link and run the reviewed smoke program natively
        run: python3 ci/runtime_release.py test --target ${{ matrix.target }}
  attest:
    name: Attest publication candidate
    needs: [build, test]
    if: inputs.release_candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linker-input-build
          path: candidate
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            candidate/build-input-release.json
            candidate/link-inputs-x64musl.tar
            candidate/link-inputs-arm64musl.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: link-input-release
          path: |
            candidate/build-input-release.json
            candidate/link-inputs-x64musl.tar
            candidate/link-inputs-arm64musl.tar
          if-no-files-found: error
          retention-days: 30
