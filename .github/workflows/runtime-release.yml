name: Linker input candidate
on:
  pull_request:
    paths:
      - scripts/runtime_build.roc
      - scripts/runtime.roc
      - scripts/runtime_test.roc
      - scripts/src/Runtime.roc
      - scripts/src/RuntimeProducer.roc
      - runtime/source.json
      - runtime/smoke.c
      - runtime/test-toolchains.json
      - Blueprint.roc
      - Blueprint.lock
      - .github/workflows/runtime-release.yml
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Attest the exact candidate for trusted publication
        required: true
        type: boolean
      expected_sha:
        description: Exact PR head selected by the trusted publisher
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: linker-input-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build linker inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind candidate to the publisher-selected commit
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@a25b5129340b9b2ad1744d20330b8ee4d38a1849
        with:
          install-nix: 'true'
      - name: Test archive admission boundaries
        run: blueprint run runtime-cli-tests
      - name: Build and package target-scoped archives
        env:
          RUNTIME_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUNTIME_SOURCE_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.head_ref) || github.ref }}
        run: |
          blueprint run runtime-build -- build
          blueprint run runtime-build -- prepare-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linker-input-build
          path: dist/runtime/
          if-no-files-found: error
          retention-days: 30
  test:
    name: Native linker test (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x64musl
          - os: ubuntu-24.04-arm
            target: arm64musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@a25b5129340b9b2ad1744d20330b8ee4d38a1849
        with:
          install-nix: 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linker-input-build
          path: dist/runtime
      - name: Link and run the reviewed smoke program natively
        env:
          TARGET: ${{ matrix.target }}
        run: blueprint run runtime-test -- test --target "$TARGET"
  attest:
    name: Attest publication candidate
    needs: [build, test]
    if: github.event_name == 'workflow_dispatch' && inputs.release_candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linker-input-build
          path: candidate
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            candidate/build-input-release.json
            candidate/link-inputs-x64musl.tar
            candidate/link-inputs-arm64musl.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: link-input-release
          path: |
            candidate/build-input-release.json
            candidate/link-inputs-x64musl.tar
            candidate/link-inputs-arm64musl.tar
          if-no-files-found: error
          retention-days: 30
