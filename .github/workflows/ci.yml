name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      nightly-tag: ${{ steps.nightly.outputs.tag }}
    steps:
      - id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

  check:
    name: Source and bindings
    needs: resolve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@a25b5129340b9b2ad1744d20330b8ee4d38a1849
        with:
          install-nix: 'true'
      - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
      - name: Source policy, formatting and unit tests
        run: blueprint run check-source
      - name: Example driver failure and timeout regressions
        run: blueprint run test-driver
      - name: Verify generated host bindings against the selected nightly
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ needs.resolve.outputs.nightly-tag }}
        run: blueprint run bindings -- --nightly-tag "$NIGHTLY_TAG"

  build:
    name: Build one bundle
    needs: resolve
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      bundle: ${{ steps.package.outputs.bundle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@a25b5129340b9b2ad1744d20330b8ee4d38a1849
        with:
          install-nix: 'true'
      - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
      - name: Fingerprint native inputs, actual toolchain and SDK
        id: host-key
        run: |
          blueprint run host-fingerprint
          echo "key=$(cat .blueprint/host-fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Restore only exactly matching host archives
        id: host
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            platform/targets/*/libhost.a
            platform/targets/*/libhost.a.sha256
          key: host-${{ runner.os }}-${{ steps.host-key.outputs.key }}
      - name: Restore content-addressed linker inputs
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.cache/roc-platform-template-rust/link-inputs
          key: linker-inputs-${{ hashFiles('runtime/link-inputs.lock.json') }}
      - name: Build hosts once for every cross-compilation target
        if: steps.host.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: blueprint run build-platform -- --target all
      - name: Verify locked inputs when hosts were restored
        if: steps.host.outputs.cache-hit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: blueprint run build-platform -- --target all --skip-host
      - name: Bundle once and freeze examples
        id: package
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          blueprint run bundle -- --target all --output-dir dist
          bundles=(dist/*.tar.zst)
          test "${#bundles[@]}" = 1
          bundle=$(basename "${bundles[0]}")
          blueprint run examples -- --operation package --release-version 0.0.1-dryrun --platform-url "https://github.com/$REPOSITORY/releases/download/0.0.1-dryrun/$bundle" --output dist/roc-platform-template-rust-examples-0.0.1-dryrun.zip
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-bundle
          path: dist/
          if-no-files-found: error

  test:
    name: Test bundle (${{ matrix.os }})
    needs: [resolve, build]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Intel macOS is cross-compiled, but has no native-execution evidence.
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@a25b5129340b9b2ad1744d20330b8ee4d38a1849
        with:
          install-nix: 'true'
      - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ci-bundle
          path: dist
      - name: Execute archived examples against the exact bundle
        env:
          BUNDLE: ${{ needs.build.outputs.bundle }}
        run: blueprint run examples -- --operation test --archive dist/roc-platform-template-rust-examples-0.0.1-dryrun.zip --bundle "dist/$BUNDLE"

  runtime-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@a25b5129340b9b2ad1744d20330b8ee4d38a1849
        with:
          install-nix: 'true'
      - name: Linker-input archive admission regressions
        run: blueprint run runtime-cli-tests

  required:
    name: CI required
    if: always()
    needs: [resolve, check, build, test, runtime-tests]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do test "$result" = success || { echo "A required job did not succeed: $RESULTS" >&2; exit 1; }; done
