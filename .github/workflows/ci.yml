name: CI

on:
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: "Validate a nightly candidate without publishing or deploying"
        type: boolean
        required: false
        default: false
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  attestations: read

jobs:
  build:
    name: ${{ matrix.lane }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        lane: [current-source]
        os:
          - macos-15       # Apple Silicon
          - macos-15-intel # Intel Mac
          - ubuntu-22.04   # Linux x86_64
          - ubuntu-24.04-arm # Linux ARM64
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Read pinned Roc nightly
        shell: bash
        run: |
          ROC_NIGHTLY_TAG=$(python3 ci/compiler_version.py)
          printf 'ROC_NIGHTLY_TAG=%s\n' "$ROC_NIGHTLY_TAG" >> "$GITHUB_ENV"

      - name: Install Roc nightly
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Test current source and local bundle
        if: matrix.lane == 'current-source'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/all_tests.sh

