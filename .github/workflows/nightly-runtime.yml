name: Nightly runtime validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: Validate a compiler candidate against the linker runtime
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Runtime build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Test archive admission boundaries
        run: python3 -m unittest discover -s ci -p 'test_runtime*.py' -v
      - name: Build and package target-scoped archives
        run: |
          python3 ci/runtime.py build
          python3 ci/runtime.py prepare-release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-runtime-build
          path: dist/runtime/
          if-no-files-found: error
          retention-days: 14

  test:
    name: Runtime test (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x64musl
          - os: ubuntu-24.04-arm
            target: arm64musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-runtime-build
          path: dist/runtime
      - name: Link and run the reviewed smoke program natively
        run: python3 ci/runtime_release.py test --target ${{ matrix.target }}
