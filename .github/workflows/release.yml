name: Release

# A pull request runs the whole pipeline as a dry run under version 0.0.0-dryrun;
# only a dispatch from main publishes.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'New package version (e.g., 1.2.0; no v prefix)'
        required: true
        type: string
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.policy.outputs.version }}
      publish: ${{ steps.policy.outputs.publish }}
      nightly-tag: ${{ steps.nightly.outputs.tag }}
    steps:
      - id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$EVENT" != workflow_dispatch ]; then
            printf 'version=0.0.0-dryrun\npublish=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$REF" = "refs/heads/$DEFAULT_BRANCH" || { echo "Releases publish from $DEFAULT_BRANCH only" >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must be MAJOR.MINOR.PATCH" >&2; exit 1; }
          # Fail closed on an existing tag or an API error; never replace a release.
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" --jq '.[].ref')
          if printf '%s\n' "$refs" | grep -qx "refs/tags/$RELEASE_TAG"; then echo "Release tag already exists" >&2; exit 1; fi
          printf 'version=%s\npublish=true\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

  build:
    name: Build and Bundle Platform
    needs: validate
    runs-on: macos-15  # macOS can cross-compile to all targets
    permissions:
      contents: read
    outputs:
      bundle_filename: ${{ steps.bundle.outputs.bundle_filename }}
      examples_filename: ${{ steps.examples.outputs.examples_filename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@a25b5129340b9b2ad1744d20330b8ee4d38a1849 # a25b512
        with:
          install-nix: 'true'

      - name: Install Roc nightly
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.validate.outputs.nightly-tag }}

      - name: Install Rust with cross-compilation targets
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Build platform for all targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: blueprint run build-platform -- --target all

      - name: Bundle platform
        id: bundle
        run: |
          blueprint run bundle -- --target all --output-dir dist
          bundles=(dist/*.tar.zst)
          test "${#bundles[@]}" = 1
          echo "bundle_filename=$(basename "${bundles[0]}")" >> "$GITHUB_OUTPUT"

      - name: Package examples archive
        id: examples
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          BUNDLE_FILENAME: ${{ steps.bundle.outputs.bundle_filename }}
        run: |
          EXAMPLES_FILENAME="roc-platform-template-rust-examples-$RELEASE_VERSION.zip"
          blueprint run examples -- --operation package --release-version "$RELEASE_VERSION" \
            --platform-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_VERSION/$BUNDLE_FILENAME" \
            --output "dist/$EXAMPLES_FILENAME"
          echo "examples_filename=$EXAMPLES_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          retention-days: 30

  # Each target runs the exact archive against the exact bundle with an empty
  # package cache; only the bundle download location changes.
  test:
    name: Test Bundle (${{ matrix.os }})
    needs: [validate, build]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15          # Apple Silicon
          - ubuntu-22.04      # Linux x86_64
          - ubuntu-24.04-arm  # Linux ARM64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@a25b5129340b9b2ad1744d20330b8ee4d38a1849 # a25b512
        with:
          install-nix: 'true'

      - name: Install Roc nightly
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.validate.outputs.nightly-tag }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Run the archived examples against the bundle
        env:
          BUNDLE_FILENAME: ${{ needs.build.outputs.bundle_filename }}
          EXAMPLES_FILENAME: ${{ needs.build.outputs.examples_filename }}
        run: blueprint run examples -- --operation test --archive "dist/$EXAMPLES_FILENAME" --bundle "dist/$BUNDLE_FILENAME"

  docs:
    name: Build Platform Docs
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Roc nightly
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.validate.outputs.nightly-tag }}

      - name: Generate docs
        run: |
          roc docs platform/main.roc --output=generated-docs --no-cache
          touch generated-docs/.nojekyll

      - name: Upload docs artifact
        if: needs.validate.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: generated-docs

  publish:
    name: Create GitHub Release
    needs: [validate, build, test, docs]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          ROC_COMPILER: ${{ needs.validate.outputs.nightly-tag }}
          BUNDLE_FILENAME: ${{ needs.build.outputs.bundle_filename }}
          EXAMPLES_FILENAME: ${{ needs.build.outputs.examples_filename }}
        working-directory: dist
        run: |
          test -f "$BUNDLE_FILENAME"
          test -f "$EXAMPLES_FILENAME"
          sha256sum "$BUNDLE_FILENAME" "$EXAMPLES_FILENAME" > SHA256SUMS
          printf 'Tested with compiler: `%s`\n\nTested source: `%s`\n\nPlatform: https://github.com/%s/releases/download/%s/%s\n' \
            "$ROC_COMPILER" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$RELEASE_VERSION" "$BUNDLE_FILENAME" > ../release-notes.md
          gh release create "$RELEASE_VERSION" "$BUNDLE_FILENAME" "$EXAMPLES_FILENAME" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_VERSION" \
            --generate-notes --notes-file ../release-notes.md

  deploy-docs:
    name: Deploy Docs to GitHub Pages
    needs: [validate, docs, publish]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy docs
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  required:
    name: Release required
    if: always()
    needs: [validate, build, test, docs]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do test "$result" = success || { echo "A required job did not succeed: $RESULTS" >&2; exit 1; }; done
