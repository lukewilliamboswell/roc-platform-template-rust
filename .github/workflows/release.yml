name: Release

on:
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: "Validate a nightly candidate without publishing or deploying"
        type: boolean
        required: false
        default: false
      release_tag:
        description: 'Release tag (e.g., v0.1.0)'
        required: false
        type: string
  pull_request:

# Ensure only one release workflow runs at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-bundle:
    name: Build and Bundle Platform
    runs-on: macos-15  # macOS can cross-compile to all targets
    outputs:
      bundle_filename: ${{ steps.bundle.outputs.bundle_filename }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Require a version for publication
        if: github.event_name == 'workflow_dispatch' && !inputs.nightly_validation
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_tag }}
        run: test -n "$RELEASE_VERSION" || { echo "A release version is required for publication" >&2; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install Rust with cross-compilation targets
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Read pinned Roc nightly
        shell: bash
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc nightly
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Build platform for all targets
        run: ./build.sh --all

      - name: Bundle platform
        id: bundle
        run: |
          # Run bundle.sh and capture output
          BUNDLE_OUTPUT=$(./bundle.sh 2>&1)
          echo "$BUNDLE_OUTPUT"

          # Extract the tar.zst filename from "Created: /path/to/HASH.tar.zst" line
          BUNDLE_PATH=$(echo "$BUNDLE_OUTPUT" | grep "^Created:" | awk '{print $2}')
          BUNDLE_FILENAME=$(basename "$BUNDLE_PATH")

          if [ -z "$BUNDLE_FILENAME" ]; then
            echo "Error: Could not extract bundle filename from output"
            echo "Bundle output was:"
            echo "$BUNDLE_OUTPUT"
            exit 1
          fi

          echo "Bundle created: $BUNDLE_FILENAME"
          echo "bundle_filename=$BUNDLE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-bundle
          path: ${{ steps.bundle.outputs.bundle_filename }}
          retention-days: 30

  test-bundle:
    name: Test Bundle (${{ matrix.os }})
    needs: build-and-bundle
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15          # Apple Silicon
          - macos-15-intel    # Intel Mac
          - ubuntu-22.04      # Linux x86_64
          - ubuntu-24.04-arm  # Linux ARM64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Read pinned Roc nightly
        shell: bash
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc nightly
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Download bundle artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-bundle

      - name: Start HTTP server for bundle
        run: |
          # Start Python HTTP server in background on port 8000
          python3 -m http.server 8000 &
          HTTP_SERVER_PID=$!
          echo "HTTP_SERVER_PID=$HTTP_SERVER_PID" >> "$GITHUB_ENV"

          # Wait for server to start
          sleep 5

          # Verify server is running and bundle is accessible
          if ! curl -f -I "http://localhost:8000/${{ needs.build-and-bundle.outputs.bundle_filename }}" > /dev/null 2>&1; then
            echo "Error: HTTP server not accessible or bundle not found"
            kill $HTTP_SERVER_PID || true
            exit 1
          fi

          echo "HTTP server started on port 8000 (PID: $HTTP_SERVER_PID)"
          echo "Bundle accessible at: http://localhost:8000/${{ needs.build-and-bundle.outputs.bundle_filename }}"

      - name: Run tests with bundled platform
        run: |
          PACKAGE_URL="http://localhost:8000/${{ needs.build-and-bundle.outputs.bundle_filename }}" \
            RUN_LOCAL_TESTS=0 \
            bash ci/all_tests.sh

  build-docs:
    name: Build Platform Docs
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned Roc nightly
        shell: bash
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc nightly
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Generate docs
        run: |
          roc docs platform/main.roc --output=generated-docs --no-cache
          touch generated-docs/.nojekyll

      - name: Upload docs artifact
        if: (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation)
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: generated-docs

  create-release:
    name: Create GitHub Release
    needs: [build-and-bundle, test-bundle]
    runs-on: ubuntu-24.04
    # Only run on manual trigger
    if: (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation)
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download bundle artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-bundle

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUNDLE_FILE=$(ls *.tar.zst | head -1)

          if [ -z "$BUNDLE_FILE" ]; then
            echo "Error: No bundle file found"
            exit 1
          fi

          # Create release with auto-generated notes
          gh release create "${{ github.event.inputs.release_tag }}" \
            "$BUNDLE_FILE" \
            --title "${{ github.event.inputs.release_tag }}" \
            --generate-notes \
            --notes "Platform bundle built with Rust (stable) and Roc nightly"

          echo "Release created: ${{ github.event.inputs.release_tag }}"
          echo "Bundle uploaded: $BUNDLE_FILE"

  deploy-docs:
    name: Deploy Docs to GitHub Pages
    needs: [build-docs, create-release]
    runs-on: ubuntu-24.04
    if: (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation)
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy docs
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
